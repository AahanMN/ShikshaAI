<svg class="diagram-svg" viewBox="0 0 760 440" role="img" aria-labelledby="svg-title svg-description"><title id="svg-title">Photosynthesis</title><desc id="svg-description">Plants use light, water, and carbon dioxide to make glucose and oxygen.</desc><defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#b9dded"></stop><stop offset="1" stop-color="#f4f3df"></stop></linearGradient><linearGradient id="water" x2="0" y2="1"><stop stop-color="#65b4cf"></stop><stop offset="1" stop-color="#347c9b"></stop></linearGradient><linearGradient id="leaf" x2="1" y2="1"><stop stop-color="#91c879"></stop><stop offset=".55" stop-color="#4f9a61"></stop><stop offset="1" stop-color="#28654d"></stop></linearGradient><linearGradient id="tissue" x2="0" y2="1"><stop stop-color="#efa4a1"></stop><stop offset="1" stop-color="#bd5962"></stop></linearGradient><radialGradient id="sun"><stop stop-color="#fff5bb"></stop><stop offset=".7" stop-color="#f7bd55"></stop><stop offset="1" stop-color="#e78b4d"></stop></radialGradient><radialGradient id="planet"><stop stop-color="#fff1bc"></stop><stop offset=".65" stop-color="#f0a866"></stop><stop offset="1" stop-color="#ba674d"></stop></radialGradient><radialGradient id="earth"><stop stop-color="#8ec5d5"></stop><stop offset=".65" stop-color="#3986a0"></stop><stop offset="1" stop-color="#24506b"></stop></radialGradient><radialGradient id="cell-fill"><stop stop-color="#fffde7"></stop><stop offset="1" stop-color="#d8e6bf"></stop></radialGradient><radialGradient id="nucleus"><stop stop-color="#e7b6dc"></stop><stop offset="1" stop-color="#95629d"></stop></radialGradient><filter id="soft-shadow" x="-.25" y="-.25" width="1.5" height="1.5"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#334d3c" flood-opacity=".18"></feDropShadow></filter><pattern id="soil" width="24" height="18" patternUnits="userSpaceOnUse"><rect width="24" height="18" fill="#9d7855"></rect><circle cx="4" cy="5" r="1.4" fill="#705638"></circle><circle cx="18" cy="12" r="1.8" fill="#c19a6c"></circle></pattern><marker id="diagram-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#55745e"></path></marker><marker id="warm-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#df865d"></path></marker><marker id="cool-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#6086a8"></path></marker></defs><style>.diagram-title{fill:#274c3a;font-family:Arial,sans-serif;font-size:22px;font-weight:700}.diagram-label{fill:#304b3a;font-family:Arial,sans-serif;font-size:13px;font-weight:600}.diagram-small-label{fill:#40564a;font-family:Arial,sans-serif;font-size:12px;font-weight:600}.diagram-connector{fill:none;stroke:#718e79;stroke-width:2.5}.diagram-node{fill:#fbfcf8;stroke-width:2.5}.diagram-orbit{fill:none;stroke:#b7c7b5;stroke-width:1.5;stroke-dasharray:4 5}.diagram-sun-label,.diagram-atom-label,.diagram-layer-label{fill:#fff;font-family:Arial,sans-serif;font-size:12px;font-weight:700}.diagram-sun-label{font-size:10px}.diagram-atom-label{font-size:17px}.diagram-layer-label{font-size:14px}.diagram-base-label{fill:#314a3c;font-family:Arial,sans-serif;font-size:12px;font-weight:700}.diagram-bond{stroke:#647d69;stroke-width:9;stroke-linecap:round}.diagram-wire{fill:none;stroke:#567d60;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.diagram-rung{stroke:#d29a55;stroke-width:3}</style><rect width="760" height="440" rx="18" fill="#fffdf7"></rect><rect width="760" height="440" fill="url(#sky)"></rect><circle cx="105" cy="112" r="44" fill="url(#sun)" filter="url(#soft-shadow)"></circle><path d="M0 352 Q200 328 408 352 T760 345 V440 H0Z" fill="url(#soil)"></path><path d="M382 352 C377 292 382 232 379 167" fill="none" stroke="#47784e" stroke-width="13" stroke-linecap="round"></path><path d="M380 235 C320 214 278 181